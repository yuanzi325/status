<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CLAUDE · Session Monitor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="haze" aria-hidden="true"></div>

  <main class="frame">
    <header class="masthead">
      <div class="brand">
        <h1>CLAUDE</h1>
        <p class="eyebrow">SESSION / CONTEXT MONITOR</p>
      </div>
      <div class="mark" id="statusMark" title="status">
        <span class="dot"></span>
      </div>
    </header>

    <section class="grid" id="grid">
      <button class="cell" data-block="window" type="button">
        <span class="cell-label">WINDOW</span>
        <span class="cell-value" data-field="value">—</span>
        <span class="cell-sub">active context span</span>
      </button>
      <button class="cell" data-block="load" type="button">
        <span class="cell-label">LOAD</span>
        <span class="cell-value" data-field="value">—</span>
        <span class="cell-sub">token pressure</span>
      </button>
      <button class="cell" data-block="pulse" type="button">
        <span class="cell-label">PULSE</span>
        <span class="cell-value" data-field="value">—</span>
        <span class="cell-sub">turn rhythm</span>
      </button>
      <button class="cell" data-block="cache" type="button">
        <span class="cell-label">CACHE</span>
        <span class="cell-value" data-field="value">—</span>
        <span class="cell-sub">read efficiency</span>
      </button>
      <button class="cell" data-block="drift" type="button">
        <span class="cell-label">DRIFT</span>
        <span class="cell-value" data-field="value">—</span>
        <span class="cell-sub">semantic offset</span>
      </button>
      <button class="cell" data-block="handover" type="button">
        <span class="cell-label">HANDOVER</span>
        <span class="cell-value" data-field="value">—</span>
        <span class="cell-sub">left before reset</span>
      </button>
    </section>

    <section class="panel" id="panel" aria-live="polite">
      <div class="panel-head">
        <div class="panel-figure">
          <span class="figure-now" id="panelNow">—</span>
          <span class="figure-sep">/</span>
          <span class="figure-max" id="panelMax">—</span>
        </div>
        <div class="panel-status" id="panelStatus">—</div>
      </div>
      <dl class="panel-rows" id="panelRows"></dl>
      <p class="panel-foot" id="panelFoot"></p>

      <div class="handover-zone" id="handoverZone" hidden>
        <button class="handover-btn" id="handoverBtn" type="button">GENERATE HANDOVER</button>
        <p class="handover-meta" id="handoverMeta" hidden></p>
        <pre class="handover-out" id="handoverOut" hidden></pre>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
